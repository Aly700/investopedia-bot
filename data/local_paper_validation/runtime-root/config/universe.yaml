master_universe:
  market: stocks
  locale: us
  active_only: true
  allowed_ticker_types:
    - CS
    - ETF
  liquidity_lookback_days: 20
  reference_cache_dir: data/cache/reference_universe
  processed_output_dir: data/processed/universe
  candidate_output_dir: data/raw
  raw_reference_filename: master_reference.csv
  master_universe_filename: master_universe.csv
  profile_summary_dir: profiles

profiles:
  broad_momentum:
    description: Broad liquid common-stock universe for momentum and breakout scans.
    active_only: true
    allowed_exchanges:
      - XNAS
      - XNYS
      - ARCX
    allowed_ticker_types:
      - CS
    common_stock_only: true
    include_etfs: false
    include_adrs: false
    exclude_weird_instruments: true
    min_price: 12
    min_average_daily_volume: 750000
    min_dollar_volume: 25000000
    min_market_cap: 2000000000
    max_symbols: 400
    preferred_symbol_groups:
      GOOGL:
        - GOOGL
        - GOOG
      FOXA:
        - FOXA
        - FOX
      NWSA:
        - NWSA
        - NWS
    exclude_symbols:
