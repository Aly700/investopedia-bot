[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investopedia-bot"
version = "0.1.0"
description = "Daily-bar research and backtesting toolkit for an Investopedia simulator trading workflow."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
]

[project.scripts]
investopedia-bot = "bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.9"
packages = ["bot"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
